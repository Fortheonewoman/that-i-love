<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Amirachi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,460;0,9..144,560;0,9..144,650;1,9..144,460;1,9..144,560&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css?v=63" />
</head>
<body>
  <div class="grain-overlay" aria-hidden="true"></div>

  <div id="locked-out" class="locked-out floral-decor" hidden>
    <p>Connect to the internet to open this.</p>
  </div>

  <div id="app" class="app" hidden>
    <div class="stamps" id="stamps" aria-label="days opened"></div>

    <main class="hero">
      <svg class="hero-bloom hero-bloom-left" viewBox="0 0 140 320" aria-hidden="true">
        <path d="M70 318 C68 250 66 200 70 150 C74 110 68 90 70 70" fill="none" stroke="#96A87F" stroke-width="3" opacity="0.9"/>
        <path d="M70 236 C50 230 38 238 30 252 C46 254 60 250 70 236Z" fill="#A6B78F" opacity="0.9"/>
        <path d="M70 196 C92 188 106 196 114 210 C96 214 82 208 70 196Z" fill="#96A87F" opacity="0.9"/>
        <g transform="translate(70,62)">
          <ellipse rx="24" ry="34" fill="#F0B8C6" opacity="0.95"/>
          <ellipse rx="24" ry="34" transform="rotate(60)" fill="#F0B8C6" opacity="0.9"/>
          <ellipse rx="24" ry="34" transform="rotate(120)" fill="#F0B8C6" opacity="0.85"/>
          <ellipse rx="24" ry="34" transform="rotate(180)" fill="#EA9FB3" opacity="0.9"/>
          <ellipse rx="24" ry="34" transform="rotate(240)" fill="#EA9FB3" opacity="0.85"/>
          <ellipse rx="24" ry="34" transform="rotate(300)" fill="#EA9FB3" opacity="0.9"/>
          <circle r="11" fill="#F3C15F"/>
        </g>
      </svg>
      <svg class="hero-bloom hero-bloom-right" viewBox="0 0 140 320" aria-hidden="true">
        <path d="M70 318 C68 250 66 200 70 150 C74 110 68 90 70 70" fill="none" stroke="#96A87F" stroke-width="3" opacity="0.9"/>
        <path d="M70 236 C50 230 38 238 30 252 C46 254 60 250 70 236Z" fill="#A6B78F" opacity="0.9"/>
        <path d="M70 196 C92 188 106 196 114 210 C96 214 82 208 70 196Z" fill="#96A87F" opacity="0.9"/>
        <g transform="translate(70,62)">
          <ellipse rx="24" ry="34" fill="#FFD08A" opacity="0.95"/>
          <ellipse rx="24" ry="34" transform="rotate(60)" fill="#FFD08A" opacity="0.9"/>
          <ellipse rx="24" ry="34" transform="rotate(120)" fill="#FFD08A" opacity="0.85"/>
          <ellipse rx="24" ry="34" transform="rotate(180)" fill="#FF9E7A" opacity="0.9"/>
          <ellipse rx="24" ry="34" transform="rotate(240)" fill="#FF9E7A" opacity="0.85"/>
          <ellipse rx="24" ry="34" transform="rotate(300)" fill="#FF9E7A" opacity="0.9"/>
          <circle r="11" fill="#E85C6B"/>
        </g>
      </svg>
      <p class="hero-eyebrow">a week of small things, then everything</p>
      <h1 class="hero-title">My Amirah</h1>

      <!-- Holds Obinna's own pre-birthday writeup once it's supplied —
           stays hidden and the page looks exactly as it does today
           until real text is dropped into content/writeup.json. Never
           filled with placeholder or invented writing. -->
      <div class="pre-birthday-writeup" id="pre-birthday-writeup" hidden></div>
    </main>

    <div class="day-grid" id="day-grid"></div>
  </div>

  <!-- The trusted countdown to her birthday, small and fixed in the
       corner rather than dominating the page — a secret ticking
       clock, not a giant digital display. Same window.TimeLock this
       whole site already trusts; no separate/weaker time source. -->
  <div class="corner-countdown" id="corner-countdown" hidden>
    <p class="corner-countdown-label">until Amirah is 21</p>
    <p class="corner-countdown-digits" id="corner-countdown-digits">— : — : — : —</p>
  </div>

  <div class="day-overlay" id="day-overlay" hidden>
    <button class="day-overlay-close" id="day-overlay-close" aria-label="close">×</button>
    <p class="overlay-countdown" id="overlay-countdown"></p>
    <div class="day-overlay-content floral-decor" id="day-overlay-content"></div>
  </div>

  <!-- Day 7's own fullscreen takeover — a sibling of #app/#day-overlay
       /#birthday, not nested inside the cream day-overlay card. See
       app.js's openDay() day7 special case and scenes/day7.js. -->
  <div id="day7-root" class="day7-root" hidden></div>

  <div id="birthday" class="birthday" hidden>
    <button type="button" class="movement-skip" id="movement-skip">skip →</button>
    <button type="button" class="mute-btn" id="mute-btn" aria-label="mute">🔊</button>
    <div class="movement-progress" id="movement-progress"></div>

    <div class="movement-stage" id="movement-stage"></div>

    <!-- Persistent across every movement — the cat, never wiped by a
         movement change so it can walk continuously between them. -->
    <div class="finale-cat-layer" id="finale-cat-layer"></div>

    <div class="replay-controls" id="replay-controls" hidden>
      <button type="button" id="replay-start">replay</button>
      <button type="button" id="replay-skip">chapters</button>
      <div class="replay-jump" id="replay-jump" hidden></div>
    </div>
  </div>

  <!-- scenes/director load first so app.js can rely on them existing
       the instant its own async code resumes — script tags block in
       order, but a later `await` inside app.js is not guaranteed to
       lose the race against these otherwise.

       The ?v=N on every file below is a cache-buster — browsers (and
       GitHub Pages itself) cache JS/CSS aggressively, so without this
       a pushed fix can silently not show up until a hard refresh.
       Bump this number whenever any of these files change. -->
  <script src="scenes/day2.js?v=63"></script>
  <script src="scenes/day3.js?v=63"></script>
  <script src="scenes/day4.js?v=63"></script>
  <script src="scenes/day5.js?v=63"></script>
  <script src="scenes/day6.js?v=63"></script>
  <script src="content/day7-letter.js?v=63"></script>
  <script src="scenes/day7.js?v=63"></script>
  <script src="scenes/finale-media.js?v=63"></script>
  <script src="scenes/finale-core.js?v=63"></script>
  <script src="scenes/finale-movement1.js?v=63"></script>
  <script src="scenes/finale-movement2.js?v=63"></script>
  <script src="scenes/finale-movement3.js?v=63"></script>
  <script src="scenes/finale-movement4.js?v=63"></script>
  <script src="scenes/finale-movement5.js?v=63"></script>
  <script src="birthday.js?v=63"></script>
  <script src="app.js?v=63"></script>
</body>
</html>
